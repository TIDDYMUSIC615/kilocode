[project]
name = "kilocode-arsenal"
version = "0.0.0"
description = "Arsenal Universe helper packages and curriculum"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = { "" = "src" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-select = ["E", "F", "I", "B", "C", "ANN"]

[tool.mypy]
python_version = 3.11
strict = true
warn_unused_ignores = true
plugins = []
files = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
